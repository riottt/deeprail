
name: Release Build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: ./scripts/generate && ./scripts/check
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: ./scripts/build-dist
      - uses: actions/upload-artifact@v4
        with:
          name: deeprail-release-candidate
          path: .artifacts/dist/
