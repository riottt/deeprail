
[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeprail-framework"
version = "0.16.8"
description = "DeepRail — AI-native organization and engineering standard, workflow runtime, and evidence-gated operating system"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-DOCUMENTATION", "LICENSE-BOUNDARY.md"]
authors = [{name = "RIO AMADA"}]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]

[project.optional-dependencies]
dev = ["build>=1.2"]
docs = ["mkdocs-material>=9,<10"]

[project.scripts]
deeprail = "deeprail_runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "runtime"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["runtime"]

[tool.setuptools.package-data]
deeprail_runtime = ["resources/**/*"]
